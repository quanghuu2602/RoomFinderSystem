<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - RoomFinder</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../../css/auth/login.css" />
</head>
<body class="auth-page">
  <header class="container auth-header"><a class="brand" href="../../index.html"><span class="brand-mark" aria-hidden="true">⌂</span>RoomFinder.</a><a class="text-link" href="../rooms/room-list.html">Xem phòng tự do ↗</a></header>
  <main class="auth-box">
    <p class="eyebrow">CHÀO MỪNG BẠN TRỞ LẠI</p>
    <h1>Đăng nhập</h1>
    <p id="loginHint" class="muted">Tiếp tục hành trình tìm nơi ở của bạn.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="ban@example.com" required />

      <label for="password">Mật khẩu</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Nhập mật khẩu của bạn" required />

      <button type="submit" id="btnLogin">Đăng nhập</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <p>Chưa có tài khoản? <a id="registerLink" href="register.html">Đăng ký</a></p>
  </main>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth/session.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/auth/login.js"></script>
</body>
</html>
